spring:
  application:
    name: logi-track-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
        page-parameter: page
        size-parameter: size
        serialization-mode: via-dto

server:
  port: ${SERVER_PORT:8080}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    ttl: ${AUTH_JWT_TTL:15m}
    issuer: logitrack-pro
    audience: logitrack-api
    clock-skew: 30s
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    name: ${AUTH_BOOTSTRAP_NAME:}
    email: ${AUTH_BOOTSTRAP_EMAIL:}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}

dashboard:
  upcoming-maintenance-limit: 5
  vehicle-utilization-ranking-limit: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
